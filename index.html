<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Campus Skill Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout concept: exam-hall console. Slim sticky bar carries the timer, one reading column for questions, a side palette that drops below on phones. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --fg: #15202f;
  --muted: #566479;
  --line: #d5dce7;
  --accent: #2548d0;
  --accent-ink: #ffffff;
  --accent-soft: #e4eaff;
  --ok: #17803d;
  --ok-soft: #dff4e6;
  --warn: #a35200;
  --warn-soft: #fdebd2;
  --bad: #b42318;
  --bad-soft: #fde4e1;
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d121a; --surface: #151c27; --surface-2: #1b2331; --fg: #e5eaf2; --muted: #9aa7ba; --line: #2a3445;
    --accent: #8aa0ff; --accent-ink: #0b1020; --accent-soft: #222c52;
    --ok: #55d98a; --ok-soft: #173424; --warn: #f2a93b; --warn-soft: #3a2b12; --bad: #ff8f84; --bad-soft: #3d1b18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d121a; --surface: #151c27; --surface-2: #1b2331; --fg: #e5eaf2; --muted: #9aa7ba; --line: #2a3445;
  --accent: #8aa0ff; --accent-ink: #0b1020; --accent-soft: #222c52;
  --ok: #55d98a; --ok-soft: #173424; --warn: #f2a93b; --warn-soft: #3a2b12; --bad: #ff8f84; --bad-soft: #3d1b18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-size: 15px; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; line-height: 1.2; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-in { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-block; position: relative; }
.brand i::after { content: ""; position: absolute; left: 6px; top: 5px; width: 6px; height: 10px; border-right: 2.5px solid var(--accent-ink); border-bottom: 2.5px solid var(--accent-ink); transform: rotate(40deg); }
.top-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; letter-spacing: 0.02em; }
.timer { font-family: var(--f-mono); font-weight: 600; font-size: 18px; padding: 4px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.timer.low { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.timer.crit { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }

.wrap { max-width: 1040px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 4px 10px; font-size: 13px; }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.hero h1 { font-size: clamp(28px, 5vw, 40px); letter-spacing: -0.02em; }
.hero .lead { margin: 12px 0 18px; color: var(--muted); max-width: 46ch; }
.facts { display: grid; gap: 10px; margin: 0; padding: 0; list-style: none; }
.facts li { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
.facts b { font-family: var(--f-mono); font-size: 13px; color: var(--accent); font-weight: 600; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label, legend { font-size: 13px; font-weight: 600; }
.field input { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 9px 12px; width: 100%; }
fieldset { border: 0; padding: 0; margin: 0 0 16px; min-width: 0; }
.domains { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 6px; }
.domains label { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; display: flex; gap: 8px; align-items: center; background: var(--surface-2); cursor: pointer; font-size: 14px; }
.domains input { accent-color: var(--accent); }
.domains label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.err { color: var(--bad); font-size: 13px; min-height: 18px; margin: 0 0 8px; }

/* MCQ */
.test { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 20px; align-items: start; }
.q-no { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.q-text { font-size: 18px; font-weight: 500; margin: 8px 0 18px; font-family: var(--f-display); line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); width: 100%; }
.opt:hover { border-color: var(--accent); }
.opt .k { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; font-weight: 600; font-family: var(--f-mono); background: var(--surface); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .k { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt span.t { overflow-wrap: anywhere; padding-top: 2px; }
.nav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; align-items: center; }
.nav .sp { flex: 1; }
.pal-title { font-size: 13px; font-weight: 600; margin-bottom: 10px; display: flex; justify-content: space-between; }
.pal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.pal button { aspect-ratio: 1; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); font-size: 12px; font-family: var(--f-mono); padding: 0; position: relative; }
.pal button.ans { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.pal button.cur { outline: 2px solid var(--fg); outline-offset: 1px; }
.pal button.flag::after { content: ""; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--surface-2); border: 1px solid var(--line); }
.legend .a::before { background: var(--accent-soft); border-color: var(--accent); }
.legend .f::before { background: var(--warn); border-color: var(--warn); border-radius: 50%; }
.submit-box { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 8px; }

/* Coding */
.tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.tabs button { padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.prob h2 { font-size: 22px; }
.prob p { margin: 8px 0 14px; color: var(--muted); white-space: pre-wrap; }
.ed-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.ed-bar select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 6px 10px; }
.code {
  width: 100%; min-height: 340px; resize: vertical; font-family: var(--f-mono); font-size: 13.5px; line-height: 1.55; tab-size: 4;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; white-space: pre; overflow: auto;
}
.note { font-size: 13px; color: var(--muted); }

/* Done */
.done { max-width: 720px; margin: 0 auto; }
.done h1 { font-size: 30px; margin-bottom: 8px; }
.codebox { font-family: var(--f-mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; max-height: 140px; overflow: auto; overflow-wrap: anywhere; user-select: all; }
.status { display: inline-block; margin: 14px 0 6px; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: 600; }
.status.ok { background: var(--ok-soft); color: var(--ok); }
.status.warn { background: var(--warn-soft); color: var(--warn); }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* Admin */
.adm-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.adm-head h1 { font-size: 26px; }
.kpis { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.kpi { padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 13px; }
.kpi b { font-family: var(--f-mono); font-size: 16px; margin-right: 6px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.tools select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 860px; font-size: 13.5px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); background: var(--surface-2); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td input.mk { width: 58px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 4px 6px; text-align: right; font-family: var(--f-mono); }
tr.sub-row td { background: var(--surface-2); }
.codeview { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.codeview pre { margin: 6px 0 0; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: auto; font-family: var(--f-mono); font-size: 12.5px; max-height: 320px; white-space: pre; }
details summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.import ta { width: 100%; min-height: 180px; }
.warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; margin-bottom: 12px; }
.okbox { background: var(--ok-soft); color: var(--ok); border-radius: 8px; padding: 10px 12px; font-size: 13.5px; margin-top: 10px; }

@media (max-width: 820px) {
  .hero, .test { grid-template-columns: minmax(0, 1fr); }
  .codeview { grid-template-columns: minmax(0, 1fr); }
  .domains { grid-template-columns: minmax(0, 1fr); }
  .q-text { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><i></i><span>Campus Skill Test</span></div>
  <div class="top-right" id="topRight"></div>
</div></header>
<div id="app"></div>

<script src="questions.js"></script>
<script>
(function () {
  "use strict";
  var DOMAINS = [
    { id: "aiml", name: "AI & Machine Learning" },
    { id: "cyber", name: "Cyber Security" },
    { id: "python", name: "Python Programming" },
    { id: "java", name: "Java Programming" },
    { id: "datascience", name: "Data Science" },
    { id: "dataanalytics", name: "Data Analytics" },
    { id: "iot", name: "Internet of Things" },
    { id: "cloud", name: "Cloud Computing" }
  ];
  var DNAME = {}; DOMAINS.forEach(function (d) { DNAME[d.id] = d.name; });
  var MCQ_MS = 30 * 60 * 1000, CODE_MS = 20 * 60 * 1000;
  var LANGS = { python: "Python", c: "C", java: "Java" };
  var STARTER = {
    python: "# Read input with input() and print the answer\n",
    c: "#include <stdio.h>\n\nint main(void) {\n    /* your code */\n    return 0;\n}\n",
    java: "import java.util.*;\n\npublic class Main {\n    public static void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n        // your code\n    }\n}\n"
  };
  var LS = "cst-attempt-v1";
  var $app = document.getElementById("app");
  var $top = document.getElementById("topRight");
  var QB = window.QBANK;

  var A = lsGet();          // the student's attempt on this device
  // Paste your Google Apps Script web app URL here (ends with /exec).
  var API_URL = "https://script.google.com/macros/s/AKfycbxpm02pePczpRdYT0T_MMVgtGpEIjIud2pAtbjLJ9Xg4o8xwzgQNK9OyKjzTiZtBZF7Ig/exec";
  var sending = false;
  var cur = 0, confirming = false, codeTab = 0, formErr = "";
  var tickId = null;

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function lsGet() { try { return JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) { return null; } }
  function lsSet() { try { if (A) localStorage.setItem(LS, JSON.stringify(A)); else localStorage.removeItem(LS); } catch (e) {} }
  function fnv(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
  function enc(o) { var j = JSON.stringify(o); return "CST1." + btoa(unescape(encodeURIComponent(j))) + "." + fnv(j); }
  function dec(s) {
    var p = s.replace(/\s+/g, "").split(".");
    if (p.length !== 3 || p[0] !== "CST1") throw new Error("Not a result code");
    var j = decodeURIComponent(escape(atob(p[1])));
    if (fnv(j) !== p[2]) throw new Error("Code is damaged or incomplete");
    return JSON.parse(j);
  }
  function mmss(ms) { if (ms < 0) ms = 0; var s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
  function fmtTime(ms) { if (!ms) return "-"; try { return new Date(ms).toLocaleString([], { dateStyle: "short", timeStyle: "short" }); } catch (e) { return new Date(ms).toISOString(); } }

  /* ---------- attempt lifecycle ---------- */
  function startAttempt(profile, domain) {
    A = {
      profile: profile, domain: domain, phase: "mcq", mcqStart: Date.now(), startedAt: Date.now(),
      ans: new Array(30).fill(-1), flags: new Array(30).fill(0),
      code: [{ lang: "python", t: {} }, { lang: "python", t: {} }], tabs: 0
    };
    cur = 0; confirming = false; codeTab = 0;
    lsSet(); render();
  }
  function finishMcq() {
    if (!A || A.phase !== "mcq") return;
    A.phase = "code"; A.mcqAt = Date.now(); A.codeStart = Date.now();
    confirming = false; codeTab = 0; lsSet(); render();
  }
  function payload() {
    return {
      n: A.profile.name, r: A.profile.reg, dp: A.profile.dept, d: A.domain,
      a: A.ans, c: A.code.map(function (c) { return { l: c.lang, t: c.t[c.lang] === undefined ? "" : c.t[c.lang] }; }),
      s: A.startedAt, ma: A.mcqAt || null, ca: A.codeAt || null, tb: A.tabs || 0
    };
  }
  function finishAll() {
    if (!A || A.phase === "done") return;
    if (A.phase === "mcq") { A.mcqAt = Date.now(); A.codeStart = Date.now(); }
    A.phase = "done"; A.codeAt = Date.now(); A.resultCode = enc(payload()); A.portal = "pending";
    confirming = false; lsSet(); render(); submitToPortal();
  }
  function recvKey() { return String(A.profile.reg).trim().toLowerCase() + "|" + A.domain; }
  function checkReceived(cb) {
    var name = "cstcb" + Date.now() + Math.floor(Math.random() * 1000), fired = false, sc = document.createElement("script");
    function fin(v) { if (fired) return; fired = true; try { delete window[name]; sc.remove(); } catch (e) {} cb(v); }
    window[name] = function (r) { fin(!!(r && r.found)); };
    sc.onerror = function () { fin(false); };
    sc.src = API_URL + (API_URL.indexOf("?") < 0 ? "?" : "&") + "check=" + encodeURIComponent(recvKey()) + "&callback=" + name;
    document.head.appendChild(sc);
    setTimeout(function () { fin(false); }, 9000);
  }
  function submitToPortal() {
    if (!A || sending) return;
    if (API_URL.indexOf("http") !== 0) { A.portal = "none"; lsSet(); paintStatus(); return; }
    sending = true; A.portal = "pending"; lsSet(); paintStatus();
    try { fetch(API_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload()) }).catch(function () {}); } catch (e) {}
    var tries = 0;
    (function poll() {
      tries++;
      setTimeout(function () {
        checkReceived(function (found) {
          if (found) { sending = false; A.portal = "ok"; lsSet(); paintStatus(); }
          else if (tries < 6) { poll(); }
          else { sending = false; A.portal = "none"; lsSet(); paintStatus(); }
        });
      }, tries === 1 ? 3000 : 4000);
    })();
  }

  /* ---------- timer ---------- */
  function tick() {
    if (!A) return;
    var el = document.getElementById("timer"), left;
    if (A.phase === "mcq") left = MCQ_MS - (Date.now() - A.mcqStart);
    else if (A.phase === "code") left = CODE_MS - (Date.now() - A.codeStart);
    else return;
    if (el) { el.textContent = mmss(left); el.className = "timer" + (left < 60000 ? " crit" : left < 300000 ? " low" : ""); }
    if (left <= 0) { if (A.phase === "mcq") finishMcq(); else finishAll(); }
  }
  tickId = setInterval(tick, 1000);
  document.addEventListener("visibilitychange", function () {
    if (A && document.hidden && (A.phase === "mcq" || A.phase === "code")) { A.tabs = (A.tabs || 0) + 1; lsSet(); }
  });

  /* ---------- views ---------- */
  function setTop(html) { $top.innerHTML = html; }
  function adminBtnHtml() { return ""; }

  function render() {
    if (!QB) { setTop(""); $app.innerHTML = '<div class="wrap"><div class="card"><h2>Questions could not load</h2><p class="muted">Reload the page. If it keeps happening, tell your instructor.</p></div></div>'; return; }
    if (!A) { setTop(adminBtnHtml()); renderHome(); return; }
    if (A.phase === "mcq") { renderMcq(); return; }
    if (A.phase === "code") { renderCode(); return; }
    setTop(adminBtnHtml()); renderDone();
  }

  function renderHome() {
    var radios = DOMAINS.map(function (d, i) {
      return '<label><input type="radio" name="dom" value="' + d.id + '"' + (i === 0 ? "" : "") + "> " + esc(d.name) + "</label>";
    }).join("");
    $app.innerHTML =
      '<div class="wrap"><div class="hero">' +
      '<section><h1>Pick your domain. Prove it.</h1>' +
      '<p class="lead">A timed two-part assessment for students. Questions are hard on purpose, so read each one fully. Results are reviewed by the hiring team and are not shown on this screen.</p>' +
      '<ul class="facts">' +
      '<li><b>PART 1</b><span>30 multiple-choice questions in your chosen domain. <strong>30 minutes.</strong></span></li>' +
      '<li><b>PART 2</b><span>2 coding problems in <strong>Python, C or Java</strong>. <strong>20 minutes.</strong></span></li>' +
      '<li><b>RULES</b><span>Each part is timed separately and submits itself when time ends. Switching browser tabs is counted.</span></li>' +
      "</ul></section>" +
      '<section class="card"><form id="reg" novalidate>' +
      '<div class="field"><label for="f-name">Full name</label><input id="f-name" autocomplete="name" maxlength="80"></div>' +
      '<div class="field"><label for="f-reg">Register number</label><input id="f-reg" maxlength="30"></div>' +
      '<div class="field"><label for="f-dept">Department and college</label><input id="f-dept" maxlength="100"></div>' +
      "<fieldset><legend>Domain</legend><div class=\"domains\">" + radios + "</div></fieldset>" +
      '<p class="err" id="err">' + esc(formErr) + "</p>" +
      '<button class="btn primary" type="submit" style="width:100%">Start Part 1</button>' +
      "</form></section></div></div>";
    document.getElementById("reg").onsubmit = function (e) {
      e.preventDefault();
      var name = document.getElementById("f-name").value.trim(), reg = document.getElementById("f-reg").value.trim(), dept = document.getElementById("f-dept").value.trim();
      var dom = document.querySelector('input[name="dom"]:checked');
      if (!name || !reg || !dept || !dom) { formErr = "Fill in every field and choose a domain."; document.getElementById("err").textContent = formErr; return; }
      formErr = "";
      startAttempt({ name: name, reg: reg, dept: dept }, dom.value);
    };
  }

  function renderMcq() {
    var qs = QB.mcq[A.domain], q = qs[cur];
    setTop('<span class="pill">' + esc(DNAME[A.domain]) + '</span><span class="pill" style="background:var(--surface-2);color:var(--muted)">Part 1 of 2</span><span class="timer" id="timer">--:--</span>');
    var answered = A.ans.filter(function (x) { return x >= 0; }).length;
    var opts = q.o.map(function (o, i) {
      return '<button class="opt' + (A.ans[cur] === i ? " sel" : "") + '" data-i="' + i + '"><span class="k">' + "ABCD"[i] + '</span><span class="t">' + esc(o) + "</span></button>";
    }).join("");
    var pal = qs.map(function (_, i) {
      return '<button data-go="' + i + '" class="' + (A.ans[i] >= 0 ? "ans " : "") + (A.flags[i] ? "flag " : "") + (i === cur ? "cur" : "") + '" aria-label="Question ' + (i + 1) + '">' + (i + 1) + "</button>";
    }).join("");
    $app.innerHTML =
      '<div class="wrap"><div class="test">' +
      '<section class="card"><div class="q-no">Question ' + (cur + 1) + " of 30</div>" +
      '<div class="q-text">' + esc(q.q) + "</div><div class=\"opts\">" + opts + "</div>" +
      '<div class="nav"><button class="btn" id="prev"' + (cur === 0 ? " disabled" : "") + ">Previous</button>" +
      '<button class="btn" id="next"' + (cur === 29 ? " disabled" : "") + ">Next</button>" +
      '<button class="btn" id="clear">Clear answer</button><span class="sp"></span>' +
      '<button class="btn" id="flag">' + (A.flags[cur] ? "Remove mark" : "Mark for review") + "</button></div></section>" +
      '<aside class="card"><div class="pal-title"><span>Questions</span><span class="muted">' + answered + " / 30 answered</span></div>" +
      '<div class="pal">' + pal + '</div><div class="legend"><span class="a">Answered</span><span class="f">Marked</span></div>' +
      '<div class="submit-box">' +
      (confirming
        ? '<p class="note" style="margin:0">' + (30 - answered) + ' unanswered. Once you submit Part 1, you cannot return to it.</p><button class="btn danger" id="sub2">Yes, submit Part 1</button><button class="btn" id="subno">Keep working</button>'
        : '<button class="btn primary" id="sub1">Submit Part 1</button><p class="note" style="margin:0">Part 2 (coding) starts right after, with its own 20-minute timer.</p>') +
      "</div></aside></div></div>";
    $app.querySelectorAll(".opt").forEach(function (b) { b.onclick = function () { A.ans[cur] = +b.dataset.i; lsSet(); renderMcq(); tick(); }; });
    $app.querySelectorAll(".pal button").forEach(function (b) { b.onclick = function () { cur = +b.dataset.go; renderMcq(); tick(); }; });
    document.getElementById("prev").onclick = function () { cur--; renderMcq(); tick(); };
    document.getElementById("next").onclick = function () { cur++; renderMcq(); tick(); };
    document.getElementById("clear").onclick = function () { A.ans[cur] = -1; lsSet(); renderMcq(); tick(); };
    document.getElementById("flag").onclick = function () { A.flags[cur] = A.flags[cur] ? 0 : 1; lsSet(); renderMcq(); tick(); };
    var s1 = document.getElementById("sub1"); if (s1) s1.onclick = function () { confirming = true; renderMcq(); tick(); };
    var s2 = document.getElementById("sub2"); if (s2) s2.onclick = finishMcq;
    var sn = document.getElementById("subno"); if (sn) sn.onclick = function () { confirming = false; renderMcq(); tick(); };
    tick();
  }

  function renderCode() {
    var probs = QB.code[A.domain], c = A.code[codeTab], p = probs[codeTab];
    setTop('<span class="pill">' + esc(DNAME[A.domain]) + '</span><span class="pill" style="background:var(--surface-2);color:var(--muted)">Part 2 of 2</span><span class="timer" id="timer">--:--</span>');
    if (c.t[c.lang] === undefined) c.t[c.lang] = STARTER[c.lang];
    var tabs = probs.map(function (_, i) { return '<button data-t="' + i + '" class="' + (i === codeTab ? "on" : "") + '">Problem ' + (i + 1) + "</button>"; }).join("");
    var langs = Object.keys(LANGS).map(function (k) { return '<option value="' + k + '"' + (k === c.lang ? " selected" : "") + ">" + LANGS[k] + "</option>"; }).join("");
    $app.innerHTML =
      '<div class="wrap"><div class="tabs">' + tabs + "</div>" +
      '<section class="card prob"><h2>' + esc(p.title) + "</h2><p>" + esc(p.prompt) + "</p>" +
      '<div class="ed-bar"><label for="lang" class="note">Language</label><select id="lang">' + langs + "</select>" +
      '<span class="note">Your code is saved as you type. It is checked automatically against hidden test cases after you finish.</span></div>' +
      '<textarea class="code" id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code editor"></textarea>' +
      '<div class="submit-box">' +
      (confirming
        ? '<p class="note" style="margin:0">Submit both coding answers and finish the test? You cannot edit afterwards.</p><div class="row" style="margin:0"><button class="btn danger" id="fin2">Yes, finish test</button><button class="btn" id="finno">Keep working</button></div>'
        : '<div class="row" style="margin:0"><button class="btn primary" id="fin1">Finish test</button></div>') +
      "</div></section></div>";
    var ed = document.getElementById("ed"); ed.value = c.t[c.lang];
    var timer = null;
    ed.oninput = function () { c.t[c.lang] = ed.value; clearTimeout(timer); timer = setTimeout(lsSet, 400); };
    ed.onkeydown = function (e) {
      if (e.key === "Tab") { e.preventDefault(); var s = ed.selectionStart; ed.value = ed.value.slice(0, s) + "    " + ed.value.slice(ed.selectionEnd); ed.selectionStart = ed.selectionEnd = s + 4; ed.oninput(); }
    };
    document.getElementById("lang").onchange = function (e) { c.lang = e.target.value; lsSet(); renderCode(); };
    $app.querySelectorAll(".tabs button").forEach(function (b) { b.onclick = function () { lsSet(); codeTab = +b.dataset.t; confirming = false; renderCode(); }; });
    var f1 = document.getElementById("fin1"); if (f1) f1.onclick = function () { confirming = true; lsSet(); renderCode(); };
    var f2 = document.getElementById("fin2"); if (f2) f2.onclick = finishAll;
    var fn = document.getElementById("finno"); if (fn) fn.onclick = function () { confirming = false; renderCode(); };
    tick();
  }

  function statusHtml() {
    if (A.portal === "ok") return '<span class="status ok">Your answers were received. You can close this page.</span>';
    if (A.portal === "pending") return '<span class="status warn">Sending your answers. Keep this page open...</span>';
    return '<span class="status warn">Not confirmed yet.</span> <div class="row"><button class="btn primary" id="resend">Send again</button></div><p class="note">Keep this page open, check your internet, then press Send again.</p>';
  }
  function paintStatus() {
    var el = document.getElementById("statusSlot");
    if (!el || !A) return;
    el.innerHTML = statusHtml();
    var rb = document.getElementById("resend"); if (rb) rb.onclick = function () { submitToPortal(); };
  }
  function renderDone() {
    $app.innerHTML =
      '<div class="wrap"><div class="done card"><h1>Test submitted</h1>' +
      '<p class="muted">Thank you, ' + esc(A.profile.name) + ". Your answers for " + esc(DNAME[A.domain]) + " are recorded. Marks are not shown here. The hiring team will contact you.</p>" +
      '<div id="statusSlot"></div></div></div>';
    paintStatus();
  }

  /* ---------- boot ---------- */
  render();
  tick();
  if (A && A.phase === "done" && A.portal !== "ok") submitToPortal();
  window.addEventListener("beforeunload", lsSet);
})();
</script>
</body>
</html>
